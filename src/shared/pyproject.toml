[project]
name = "eduhub-shared"
version = "1.2.0"
description = "Shared contracts: domain models, interfaces, metric formulas, OpenAPI, fixtures and fakes."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "tzdata>=2025.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eduhub_shared"]
