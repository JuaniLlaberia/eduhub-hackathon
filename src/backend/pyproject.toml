[project]
name = "eduhub-backend"
version = "0.1.0"
description = "Back team: data ingestion, analysis jobs, HTTP API, publishing and deployment."
requires-python = ">=3.12"
dependencies = [
    "eduhub-shared",
    "eduhub-ai",
    "fastapi>=0.160,<1",
    "uvicorn>=0.49,<1",
    "pydantic-settings>=2.14,<3",
    "aiosqlite>=0.22,<1",
]

[dependency-groups]
test = [
    "httpx>=0.28,<1",
    "asgi-lifespan>=2.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eduhub_backend"]
