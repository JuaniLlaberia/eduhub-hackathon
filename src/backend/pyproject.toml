[project]
name = "eduhub-backend"
version = "0.1.0"
description = "Back team: data ingestion, analysis jobs, HTTP API, publishing and deployment."
requires-python = ">=3.12"
dependencies = [
    "eduhub-shared",
    "eduhub-ai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eduhub_backend"]
