[project]
name = "eduhub-ai"
version = "0.1.0"
description = "AI team: analysis, insights, draft generation and audience sandbox."
requires-python = ">=3.12"
dependencies = [
    "eduhub-shared",
    "openai>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eduhub_ai"]
